appId: com.voiceflow.app
productName: VoiceFlow
copyright: Copyright © 2026 VoiceFlow
directories:
  output: build
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: build/tray.png
    to: tray.png
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico
  - from: bin/
    to: bin/
    filter: ["**/*"]
asar: true
win:
  target: nsis
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
  sign: null
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VoiceFlow
  uninstallDisplayName: VoiceFlow
publish: null
