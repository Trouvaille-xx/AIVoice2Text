appId: com.voiceflow.app
productName: VoiceFlow
copyright: Copyright © 2026 VoiceFlow
directories:
  output: build
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  target: nsis
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VoiceFlow
  uninstallDisplayName: VoiceFlow
publish: null
